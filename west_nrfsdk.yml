manifest:
  remotes:
    - name: sdk
      url-base: https://github.com/nrfconnect
    - name: zephyr
      url-base: https://github.com/zephyrproject-rtos
    - name: IntergatedCircuits
      url-base: https://github.com/IntergatedCircuits
  self:
    path: firmware
    west-commands: scripts/west_commands.yml
    import:
    - submanifests/c2usb.yml

  projects:
    - name: zephyrrtos-mcpp
      remote: IntergatedCircuits
      revision: 1055edd60a7862c963058ac267d188e9439614d3
      path: modules/lib/zephyrrtos-mcpp

    - name: sdk-nrf
      remote: sdk
      path: nrf
      revision: v3.3.0
      clone-depth: 1
      import:
        # path-prefix: nrfconnect
        name-allowlist:
          - zephyr
          - cmsis_6
          - hal_nordic
          - mcuboot
          - nrfxlib
          - lvgl
          - segger
          - zcbor
          - mbedtls
          - oberon-psa-crypto
